# Normative role of each corpus document, for the consent → provision benchmark (DRAFT v0.1)
#
#   law       binding legislation, regulation, implementing act or ratifiable treaty
#   policy    GA4GH approved policy (normative for GA4GH members and Driver Projects)
#   guidance  soft law: recommendations, declarations, regulator guidance, briefs, standards
#   template  model clauses meant to be copied into consent forms or agreements
#   summary   contributor paraphrase, not a published source text
#
# Crosswalk cells are pooled from law / policy / guidance. Templates are excluded from the
# provision slots: they are written in the same register as the consent form being reviewed,
# so they out-rank the provisions that govern it (the "genre attraction" failure). They remain
# useful to a reviewer as exemplars and are returned in a separate channel.

version: '0.1'
roles:
  # GA4GH
  ga4gh-frs: policy
  ga4gh-consent-policy: policy
  ga4gh-privacy-security-policy: policy
  ga4gh-errp: policy
