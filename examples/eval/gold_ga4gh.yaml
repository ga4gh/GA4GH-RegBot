# RegBot retrieval gold set (GSoC 2026 Phase 2) — see docs/DESIGN.md §4.2
#
# Labels are ANCHORS, not literal chunk ids. Chunk ids embed a hash of the ingest path
# (see ingestion._stable_source_id), so an id recorded on one machine does not resolve on
# another. Anchors are matched against the live store manifest at benchmark time:
#
#   document_id: <corpus manifest document_id>   (required in practice)
#   contains:    <distinctive verbatim phrase from the chunk, whitespace-insensitive>
#   page:        <page number>                   (optional extra constraint)
#   chunk_id:    <literal id>                    (escape hatch; not portable)
#
# An anchor that resolves to nothing is reported as `unresolved_anchors`, and a query whose
# anchors all fail is SKIPPED rather than scored — a stale gold set fails loudly instead of
# silently inflating recall.
#
# `jurisdiction` sets the retrieval filter for that query. Queries with regional scope use
# a filter (the realistic usage pattern, and it exercises the filter path); framework-level
# queries are left unfiltered to measure raw hybrid retrieval over the whole corpus.
#
# Run:  python -m src.main benchmark --gold examples/eval/gold_ga4gh.yaml
#
# STATUS: drafted by the contributor. NOT YET MENTOR-REVIEWED — see docs/eval_results.md
# before quoting these numbers.

version: '0.3'
updated: '2026-07-28'
notes: >-
  v0.3 — re-anchored after the P0/P1 corpus moved from contributor paraphrases to primary
  sources (official GDPR text from EUR-Lex, GA4GH published documents). Anchors now point
  at operative provisions in the law itself — GDPR Art. 7(3) for withdrawal, Art. 35 for
  DPIA, Art. 44/46 for transfers, Recital 33 for broad consent — rather than at a summary
  of them, so a relevance judgment is a judgment about the regulation and not about the
  contributor's own wording. Anchors are kept narrow (1-3 chunks each) so that a broad
  phrase does not sweep marginal chunks into the gold set and depress recall artificially.
  P2 regional queries are unchanged: those documents remain contributor summaries by
  design and are marked content_type: summary.

queries:
  - query_id: q01-withdrawal-ga4gh
    query: How must withdrawal of consent be handled in genomic data sharing?
    relevant:
      # GDPR Art. 7(3) — the operative right
      - document_id: gdpr-full-text
        contains: right to withdraw his or her consent at any time
      - document_id: gdpr-withdrawal-consent
        contains: distinguish between consent
      - document_id: ga4gh-consent-policy
        contains: withdrawal, complaints
      - document_id: ga4gh-frs
        contains: processes of withdrawal from data sharing

  - query_id: q02-withdrawal-tw-biobank
    query: Can participants withdraw from a Taiwan biobank, and what happens to retained samples?
    jurisdiction: [TW]
    relevant:
      - document_id: tw-law-excerpt
        contains: biobanks must establish procedures for withdrawal

  - query_id: q03-transfer-safeguards-gdpr
    query: What safeguards apply to international transfers of genomic data under the GDPR?
    relevant:
      # GDPR Art. 44 general principle, Art. 46 appropriate safeguards
      - document_id: gdpr-full-text
        contains: Any transfer of personal data which are undergoing processing
      - document_id: gdpr-full-text
        contains: standard data protection clauses adopted by the Commission
      - document_id: gdpr-international-transfers
        contains: must adhere to at least one of the lawful avenues

  - query_id: q04-cn-hgr-approval
    query: What approval is required to supply human genetic resources from China to foreign collaborators?
    jurisdiction: [CN]
    relevant:
      - document_id: cn-law-excerpt
        contains: without approval from relevant authorities

  - query_id: q05-hk-section-33
    query: Is the Hong Kong cross-border data transfer restriction currently in force?
    jurisdiction: [HK]
    relevant:
      - document_id: hk-law-excerpt
        contains: Section 33 has not been brought into force

  - query_id: q06-jp-transfer-mechanisms
    query: What mechanisms permit transferring personal data out of Japan for research?
    jurisdiction: [JP]
    relevant:
      - document_id: jp-law-excerpt
        contains: standard contractual clauses approved by PPC

  - query_id: q07-kr-separate-consent
    query: Does Korean law require separate consent for sensitive genetic data?
    jurisdiction: [KR]
    relevant:
      - document_id: kr-law-excerpt
        contains: requires separate consent for collection and use

  - query_id: q08-sg-transfer-limitation
    query: Can personal data be transferred outside Singapore for research collaboration?
    jurisdiction: [SG]
    relevant:
      - document_id: sg-law-excerpt
        contains: must not transfer personal data outside Singapore

  - query_id: q09-dpia-trigger
    query: When is a data protection impact assessment required for large-scale genomic research?
    relevant:
      # GDPR Art. 35(1) — the trigger itself
      - document_id: gdpr-full-text
        contains: carry out an assessment of the impact of the envisaged processing operations
      - document_id: gdpr-dpia-genomic-research
        contains: impact assessment

  - query_id: q10-broad-consent-validity
    query: Is broad consent for unspecified future genomic research valid under the GDPR?
    relevant:
      # GDPR Recital 33 — the research-consent carve-out
      - document_id: gdpr-full-text
        contains: not possible to fully identify the purpose of personal data processing for scientific research
      - document_id: gdpr-consent-broad-genomic-research
        contains: broad consent

  - query_id: q11-reidentification
    query: Are researchers permitted to attempt re-identification of anonymized genomic data?
    relevant:
      - document_id: ga4gh-frs
        contains: Forego any attempt to re-identify anonymized data
      - document_id: ga4gh-consent-policy
        contains: risk of re-identifying individuals

  - query_id: q12-duo-consent-codes
    query: How do machine-readable consent codes and DUO support Data Access Committee review?
    relevant:
      - document_id: ga4gh-duo-data-use-ontology
        contains: computer-readable use permissions
      - document_id: ga4gh-mrcg-consent-duo-brief
        contains: co-created Machine Readable Consent Guidance
