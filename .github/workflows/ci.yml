name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.10.1
          # These Chroma advisories require its separately exposed HTTP server.
          # RegBot only uses PersistentClient with precomputed embeddings; see the
          # per-advisory applicability review in docs/RELEASE_CHECKLIST.md.
          pip-audit -r requirements.txt --progress-spinner=off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test*.py" -v
