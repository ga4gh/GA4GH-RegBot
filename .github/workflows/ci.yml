name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.10.1
          # PYSEC-2026-311 is an RCE in Chroma's separately exposed FastAPI server.
          # RegBot only constructs the in-process PersistentClient and never starts it.
          pip-audit -r requirements.txt --progress-spinner=off --ignore-vuln PYSEC-2026-311

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test*.py" -v
