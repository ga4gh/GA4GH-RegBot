name: Retrieval benchmark

# Not run on every PR: it ingests the corpus, which downloads the embedding model
# (~90 MB) and takes minutes. The metric logic itself is unit-tested in the fast CI
# job (tests/test_evaluation.py stubs the retriever), so PRs still catch scoring bugs.
#
# This job measures the real pipeline end to end. It is an engineering regression gate,
# not an independently validated performance claim: the gold set is contributor-labelled
# and still awaits mentor review (see docs/eval_results.md). Provision recall is used
# because it is stable across equivalent chunk-boundary changes. Retrieval is deterministic
# as of the exact-cosine fix, so the gate does not depend on approximate-index ordering.

on:
  workflow_dispatch:
    inputs:
      min_provision_recall:
        description: "Fail if macro provision recall at the largest k is below this"
        required: true
        default: "0.90"
  schedule:
    # Mondays 06:00 UTC — catches drift from dependency bumps.
    - cron: "0 6 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest corpus
        run: python -m src.main ingest-manifest --reset

      - name: Run benchmark
        env:
          MIN_PROVISION_RECALL: ${{ github.event.inputs.min_provision_recall || '0.90' }}
        run: |
          set -o pipefail
          python -m src.main benchmark \
            --markdown benchmark_report.md \
            --min-provision-recall "$MIN_PROVISION_RECALL" \
            | tee benchmark_result.json

      - name: Summary
        if: always()
        run: cat benchmark_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: |
            benchmark_report.md
            benchmark_result.json
